name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-tests:
    name: CPU Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install native tokenizer deps (PCRE2 & utf8proc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpcre2-dev libutf8proc-dev

      - name: Build and run C++ unit tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Icpp tests/test_tool_parser.cpp -o /tmp/amperegen_unit_tests
          /tmp/amperegen_unit_tests

          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Icpp tests/test_bpe_detokenizer.cpp -o /tmp/amperegen_bpe_detok_tests
          /tmp/amperegen_bpe_detok_tests

          g++ -std=c++20 -O2 -Wall -Wextra -Wno-unused-parameter -Icpp -isystem third_party \
            cpp/server/tokenizer.cpp tests/test_native_tokenizer.cpp \
            $(pkg-config --libs libpcre2-8 libutf8proc) \
            -o /tmp/amperegen_tokenizer_tests
          /tmp/amperegen_tokenizer_tests

      - name: Check helper benchmark/reference script syntax
        run: python3 -m py_compile ref/torch_ref.py tools/*.py

  cuda-build:
    name: CUDA 12.8 (sm_80) Build
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build pkg-config libpcre2-dev libutf8proc-dev

      - name: Configure & Build (portable x86-64-v3, sm_80)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMPEREGEN_PORTABLE=ON
          ninja -C build amperegen amperegen_test amperegen_unit_tests amperegen_bpe_detok_tests amperegen_tokenizer_tests

      - name: Run CPU unit tests & verify binary linkage
        run: |
          ./build/amperegen_unit_tests
          ./build/amperegen_bpe_detok_tests
          ./build/amperegen_tokenizer_tests
          ./build/amperegen --list-weight-backends
          ldd ./build/amperegen
